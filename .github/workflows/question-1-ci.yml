name: SOP-Agent-一个基于 SOP 文档的 On-Call 助手

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        working-directory: SOP-Agent-一个基于 SOP 文档的 On-Call 助手
        run: python -m unittest discover -s tests
      - name: Run extended tests with coverage
        working-directory:  SOP-Agent-一个基于 SOP 文档的 On-Call 助手
        run: python scripts/coverage_test2.py
      - name: Run README verification checks
        working-directory: SOP-Agent-一个基于 SOP 文档的 On-Call 助手
        run: python scripts/verify.py
